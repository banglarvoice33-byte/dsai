appId: com.dsai.platform
productName: DSAI
directories:
  output: dist
files:
  - main.cjs
  - package.json
asar: true
npmRebuild: false
win:
  icon: assets/DSAI.ico
  target:
    - target: nsis
    - target: msi
  artifactName: DSAI-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
msi:
  perMachine: false
mac:
  icon: build/icon.svg
  target:
    - dmg
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  artifactName: DSAI-${version}-${arch}.${ext}
