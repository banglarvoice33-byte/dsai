services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dsai:local
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://dsai:dsai_local_password@postgres:5432/dsai
      # Only the internal Compose database is plaintext; remote hosts still require TLS.
      DATABASE_SSL: disable
    # Keep the app private to the host; put a TLS reverse proxy in front when needed.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17.5
    environment:
      POSTGRES_DB: dsai
      POSTGRES_USER: dsai
      POSTGRES_PASSWORD: dsai_local_password
    volumes:
      - dsai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsai -d dsai"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  dsai_postgres_data:
