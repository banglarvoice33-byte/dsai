plugins {
    id "com.android.application"
}

android {
    namespace "com.dsai.platform"
    compileSdk 35

    defaultConfig {
        applicationId "com.dsai.platform"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
        def origin = project.findProperty("dsaiOrigin") ?: "https://genesisai-86cmsdxx.manus.space"
        buildConfigField "String", "DSAI_ORIGIN", "\"${origin}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
