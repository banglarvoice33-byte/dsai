plugins {
    id "com.android.application"
}

android {
    namespace "com.dsai.platform"
    compileSdk 35

    defaultConfig {
        applicationId "com.dsai.platform"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
        def origin = project.findProperty("dsaiOrigin") ?: "https://genesisai-86cmsdxx.manus.space"
        buildConfigField "String", "DSAI_ORIGIN", "\"${origin}\""
    }

    buildFeatures {
        buildConfig true
    }

    def signingPath = System.getenv("DSAI_KEYSTORE_PATH")
    def signingStorePassword = System.getenv("DSAI_KEYSTORE_PASSWORD")
    def signingAlias = System.getenv("DSAI_KEY_ALIAS")
    def signingKeyPassword = System.getenv("DSAI_KEY_PASSWORD")
    if (signingPath && signingStorePassword && signingAlias && signingKeyPassword) {
        signingConfigs {
            release {
                storeFile file(signingPath)
                storePassword signingStorePassword
                keyAlias signingAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (signingPath && signingStorePassword && signingAlias && signingKeyPassword) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
