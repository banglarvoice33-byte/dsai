plugins {
    id "com.android.application"
}

android {
    namespace "com.dsai.platform"
    compileSdk 35

    defaultConfig {
        applicationId "com.dsai.platform"
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName "1.0.1"

        // Always default to the canonical DSAI Production domain.
        // A custom HTTPS origin can be supplied for controlled non-production testing.
        def origin = (project.findProperty("dsaiOrigin") ?: "https://dsai-one.vercel.app").toString().replaceAll(/\/$/, "")
        def parsedOrigin = new URI(origin)
        if (parsedOrigin.scheme != "https" || !parsedOrigin.host ||
            parsedOrigin.userInfo || parsedOrigin.query || parsedOrigin.fragment ||
            parsedOrigin.path) {
            throw new GradleException("dsaiOrigin must be a bare HTTPS origin without credentials, path, query, or fragment")
        }
        buildConfigField "String", "DSAI_ORIGIN", "\"${origin}\""
    }

    buildFeatures {
        buildConfig true
    }

    def signingPath = System.getenv("DSAI_KEYSTORE_PATH")
    def signingStorePassword = System.getenv("DSAI_KEYSTORE_PASSWORD")
    def signingAlias = System.getenv("DSAI_KEY_ALIAS")
    def signingKeyPassword = System.getenv("DSAI_KEY_PASSWORD")
    if (signingPath && signingStorePassword && signingAlias && signingKeyPassword) {
        signingConfigs {
            release {
                storeFile file(signingPath)
                storePassword signingStorePassword
                keyAlias signingAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (signingPath && signingStorePassword && signingAlias && signingKeyPassword) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
