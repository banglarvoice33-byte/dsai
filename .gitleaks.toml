title = "DSAI Gitleaks configuration"

[extend]
useDefault = true

# The negative-auth integration fixture intentionally uses a non-secret placeholder.
# Scope this exception to that one test file and exact placeholder only; all other
# default Gitleaks rules remain enabled across the repository.
[[allowlists]]
description = "Non-secret wrong-token fixture in YARA negative-auth test"
condition = "AND"
commits = ["356a6bd36103a7348ae7891575a57a4594a1dd12"]
paths = ['''^scanner-yara/smoke-test\.sh$''']
regexes = ['''wrong-token''']
regexTarget = "line"
