name: DSAI iOS Native Build

on:
  pull_request:
    paths:
      - ".github/workflows/ios-native.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ios-native.yml"
  workflow_dispatch:
    inputs:
      build_ipa:
        description: Build a signed App Store IPA (requires protected Apple signing secrets)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ios:
    name: Generate and validate iOS wrapper
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify App Store Connect Xcode and iOS SDK baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          xcodebuild -version
          xcodebuild -showsdks | tee "$RUNNER_TEMP/xcode-sdks.txt"
          xcode_major="$(xcodebuild -version | awk '/^Xcode / { split($2, version, "."); print version[1] }')"
          ios_sdk_major="$(sed -nE 's/.*iOS ([0-9]+)(\.[0-9]+)?.*/\1/p' "$RUNNER_TEMP/xcode-sdks.txt" | sort -nr | head -1)"
          if [[ -z "$xcode_major" || -z "$ios_sdk_major" ]] || (( xcode_major < 26 || ios_sdk_major < 26 )); then
            echo "App Store uploads require Xcode 26+ and iOS 26+ SDK." >&2
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Generate isolated Capacitor iOS shell
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/dsai-ios"
          cd "$RUNNER_TEMP/dsai-ios"
          cat > package.json <<'JSON'
          {"private":true,"dependencies":{"@capacitor/core":"6.2.1","@capacitor/ios":"6.2.1"},"devDependencies":{"@capacitor/cli":"6.2.1"}}
          JSON
          npm install
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.dsai.platform",
            "appName": "DSAI",
            "webDir": "www",
            "server": {
              "url": "https://dsai-one.vercel.app",
              "cleartext": false,
              "allowNavigation": ["dsai-one.vercel.app"]
            },
            "ios": {
              "contentInset": "automatic",
              "allowsLinkPreview": false
            }
          }
          JSON
          mkdir -p www
          printf '<!doctype html><meta charset="utf-8"><title>DSAI</title><p>Loading DSAI…</p>' > www/index.html
          npx cap add ios
          npx cap sync ios
      - name: Validate Xcode project and build unsigned simulator app
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/dsai-ios/ios/App"
          pod install --repo-update
          test -s App.xcworkspace/contents.xcworkspacedata
          xcodebuild -list -workspace App.xcworkspace
          xcodebuild -workspace App.xcworkspace -scheme App -sdk iphonesimulator -configuration Release -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO build
          test -d "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator/App.app"
      - name: Import Apple Distribution identity and provisioning profile
        if: ${{ vars.DSAI_IOS_SIGNING_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && inputs.build_ipa == true }}
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in IOS_CERTIFICATE_P12_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 IOS_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then echo "::error::Missing protected secret: $name"; exit 1; fi
          done
          KEYCHAIN_PATH="$RUNNER_TEMP/dsai-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERT_PATH="$RUNNER_TEMP/apple-distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/dsai.mobileprovision"
          printf '%s' "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          chmod 600 "$CERT_PATH" "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "DSAI_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "DSAI_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Archive and export signed iOS IPA
        if: ${{ vars.DSAI_IOS_SIGNING_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && inputs.build_ipa == true }}
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/dsai-ios/ios/App"
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/DSAI.xcarchive" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$IOS_TEAM_ID" CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER="$DSAI_PROFILE_NAME" archive
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>teamID</key><string>$IOS_TEAM_ID</string>
          <key>signingStyle</key><string>manual</string>
          <key>provisioningProfiles</key><dict><key>com.dsai.platform</key><string>$DSAI_PROFILE_NAME</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/DSAI.xcarchive" -exportPath "$RUNNER_TEMP/ipa" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          shasum -a 256 "$RUNNER_TEMP"/ipa/*.ipa > "$RUNNER_TEMP/ipa/SHA256SUMS.txt"

      - name: Upload signed IPA
        if: ${{ vars.DSAI_IOS_SIGNING_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && inputs.build_ipa == true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DSAI-iOS-signed-IPA
          path: |
            ${{ runner.temp }}/ipa/*.ipa
            ${{ runner.temp }}/ipa/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/dsai-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/apple-distribution.p12" "$RUNNER_TEMP/dsai.mobileprovision" "$RUNNER_TEMP/profile.plist"
