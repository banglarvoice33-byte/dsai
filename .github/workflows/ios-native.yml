name: DSAI iOS Native Build

on:
  pull_request:
    paths:
      - "desktop/**"
      - "ios/**"
      - ".github/workflows/ios-native.yml"
      - ".github/workflows/ios-native.yml"
  workflow_dispatch:
  push:
    tags:
      - "ios-v*"

permissions:
  contents: read

jobs:
  ios:
    name: Generate and validate iOS wrapper
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Generate isolated Capacitor iOS shell
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/dsai-ios"
          cd "$RUNNER_TEMP/dsai-ios"
          cat > package.json <<'JSON'
          {"private":true,"dependencies":{"@capacitor/core":"6.2.1","@capacitor/ios":"6.2.1"},"devDependencies":{"@capacitor/cli":"6.2.1"}}
          JSON
          npm install
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.dsai.platform",
            "appName": "DSAI",
            "webDir": "www",
            "server": {
              "url": "https://dsai-one.vercel.app",
              "cleartext": false,
              "allowNavigation": ["dsai-one.vercel.app"]
            },
            "ios": {
              "contentInset": "automatic",
              "allowsLinkPreview": false
            }
          }
          JSON
          mkdir -p www
          printf '<!doctype html><meta charset="utf-8"><title>DSAI</title><p>Loading DSAI…</p>' > www/index.html
          npx cap add ios
          npx cap sync ios
      - name: Validate Xcode project and build unsigned simulator app
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/dsai-ios/ios/App"
          xcodebuild -list -project App.xcodeproj
          xcodebuild -project App.xcodeproj -scheme App -sdk iphonesimulator -configuration Release -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO build
          test -d "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator/App.app"
      - name: Upload unsigned simulator build and Xcode project
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DSAI-iOS-unsigned-simulator-and-project
          path: |
            ${{ runner.temp }}/DerivedData/Build/Products/Release-iphonesimulator/App.app
            ${{ runner.temp }}/dsai-ios/ios/App
          if-no-files-found: error
          retention-days: 14

  signed-ipa:
    name: Build signed IPA (requires Apple Developer credentials)
    if: ${{ vars.DSAI_IOS_SIGNING_ENABLED == 'true' }}
    runs-on: macos-14
    steps:
      - name: Explain required protected signing inputs
        run: |
          echo "Signed IPA requires Apple Developer account-issued certificate, provisioning profile, team ID, and App Store Connect distribution configuration."
          echo "No signing assets are generated or exposed by this workflow. Configure protected secrets after obtaining them from Apple."
