name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dsai-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: TypeScript, accessibility, tests, production and Docker builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          package_json_file: package.json
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.2
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm run check
      - name: Accessibility checks
        run: pnpm run check:a11y
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm run build
      - name: Docker Compose database-readiness smoke test
        shell: bash
        run: |
          set -Eeuo pipefail
          cp .env.production.example .env
          cleanup() {
            docker compose down --volumes --remove-orphans || true
            rm -f .env
          }
          trap cleanup EXIT
          docker compose up --detach --build
          for attempt in $(seq 1 60); do
            response="$(curl --silent --show-error http://127.0.0.1:3000/readyz || true)"
            if printf '%s' "$response" | grep --quiet '"status":"ready"'; then
              echo "DOCKER_COMPOSE_DATABASE_READINESS=PASS"
              exit 0
            fi
            if ! docker compose ps --status running --services | grep --quiet --fixed-strings --line-regexp -- app; then
              echo "APP_CONTAINER_EXITED_BEFORE_READY=FAIL"
              docker compose logs app postgres || true
              exit 1
            fi
            sleep 2
          done
          echo "DOCKER_COMPOSE_DATABASE_READINESS=FAIL"
          docker compose logs app postgres || true
          exit 1
