name: CI

on:
  workflow_dispatch:
  # Run the same release-quality checks before a change can be merged to main.
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main, fix/file-upload-bengali-errors-20261120, feat/lead-workdesk-acknowledgment]

permissions:
  contents: read

concurrency:
  group: dsai-ci-${{ github.workflow }}-${{ github.ref }}
  # A newer commit supersedes older verification runs; keep the latest main checks unblocked.
  cancel-in-progress: true

jobs:
  verify:
    name: TypeScript, accessibility, tests, production and Docker builds
    # Playwright 1.56 browser dependencies are pinned to the supported Ubuntu 24.04 runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4.1.0
        with:
          package_json_file: package.json
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4.4.0
        with:
          node-version: 24.22.2
          cache: pnpm
      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Dependency security audit
        id: dependency-audit
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          set +e
          pnpm audit --json > artifacts/pnpm-audit.json
          audit_status=$?
          set -e
          echo "$audit_status" > artifacts/pnpm-audit-exit-code.txt
          pnpm audit --audit-level=low || true
          exit "$audit_status"
      - name: Production dependency license inventory
        id: license-inventory
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          pnpm dlx @lizenz/checker@0.0.2 --production --json --out artifacts/licenses.json --unknown
          test -s artifacts/licenses.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const report = JSON.parse(fs.readFileSync("artifacts/licenses.json", "utf8"));
          const sourceOverrides = JSON.parse(fs.readFileSync("license-overrides.json", "utf8"));
          const entries = Object.entries(report);
          if (entries.length === 0) throw new Error("LICENSE_INVENTORY_EMPTY");
          const unknown = entries.filter(([name, item]) => {
            const licenses = Array.isArray(item.licenses) ? item.licenses : [item.licenses];
            const declared = licenses.some(value => value && !/^(UNKNOWN|UNLICENSED)$/i.test(String(value).trim()));
            const override = sourceOverrides[name];
            const sourceVerified = override?.status === "source-verified"
              && typeof override.license === "string"
              && typeof override.evidence === "string"
              && override.evidence.startsWith("https://");
            return !declared && !sourceVerified;
          });
          if (unknown.length) {
            process.stderr.write("LICENSE_UNKNOWN_PACKAGES=" + JSON.stringify(unknown.map(([name]) => name)) + "\\n");
            process.exit(1);
          }
          console.log("LICENSE_INVENTORY=PASS packages=" + entries.length);
          for (const [name, override] of Object.entries(sourceOverrides)) console.log("LICENSE_SOURCE_VERIFIED=" + name + " license=" + override.license + " (owner/legal approval pending)");
          console.log("LICENSE_POLICY=HUMAN_REVIEW_REQUIRED (no owner-approved allow-list is recorded)");
          NODE
      - name: TypeScript
        run: pnpm run check
      - name: Supabase Edge Function type check
        run: deno check --node-modules-dir=auto supabase/functions/dsai-image-generate/index.ts
      - name: Supabase free-image cost policy tests
        run: deno test --node-modules-dir=auto supabase/functions/dsai-image-generate/imagePolicy_test.ts
      - name: Contract acknowledgment migration and negative RLS integration
        shell: bash
        run: |
          set -Eeuo pipefail
          cleanup() { docker rm --force dsai-ack-postgres >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --rm --name dsai-ack-postgres \
            -e POSTGRES_PASSWORD=ci-test-password \
            -e POSTGRES_DB=dsai_ack_test \
            -p 55432:5432 postgres:17.6-alpine
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec dsai-ack-postgres pg_isready -U postgres -d dsai_ack_test >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          test "$ready" -eq 1
          docker exec -i dsai-ack-postgres psql -v ON_ERROR_STOP=1 -U postgres -d dsai_ack_test <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE TABLE public.users (id integer PRIMARY KEY);
          INSERT INTO public.users (id) VALUES (1);
          CREATE SCHEMA IF NOT EXISTS private;
          SQL
          docker exec -i dsai-ack-postgres psql -v ON_ERROR_STOP=1 -U postgres -d dsai_ack_test < supabase/migrations/20261120101016_dsai_workdesk_text_only_tasks.sql
          docker exec -i dsai-ack-postgres psql -v ON_ERROR_STOP=1 -U postgres -d dsai_ack_test < supabase/migrations/20261120111316_dsai_workdesk_text_task_queue.sql
          docker exec -i dsai-ack-postgres psql -v ON_ERROR_STOP=1 -U postgres -d dsai_ack_test < supabase/migrations/20261121150000_dsai_workdesk_persist_edited_results.sql
          docker exec -i dsai-ack-postgres psql -v ON_ERROR_STOP=1 -U postgres -d dsai_ack_test < scripts/test-workdesk-edited-results.sql
          docker exec -i dsai-ack-postgres psql -v ON_ERROR_STOP=1 -U postgres -d dsai_ack_test < supabase/migrations/20261121130000_dsai_contract_acknowledgment.sql
          docker exec -i dsai-ack-postgres psql -v ON_ERROR_STOP=1 -U postgres -d dsai_ack_test < scripts/test-contract-acknowledgment-rls.sql
      - name: Accessibility checks
        run: pnpm run check:a11y
      - name: Production stub and mock-boundary audit
        run: pnpm run check:stubs
      - name: Unit tests with machine-readable JUnit report
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          pnpm exec vitest run --reporter=default --reporter=junit --outputFile=artifacts/junit.xml
          test -s artifacts/junit.xml
      - name: Production build
        run: pnpm run build
      - name: Built artifact browser acceptance (Chromium)
        shell: bash
        env:
          # Test the exact artifact produced in this job; Vercel Production is verified separately.
          DSAI_BROWSER_URL: http://127.0.0.1:4173
          DSAI_BROWSER_MODE: preview
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          npm install --prefix "$RUNNER_TEMP/dsai-browser-smoke" --no-save playwright@1.56.1 @axe-core/playwright@4.14.0
          if [ "$DSAI_BROWSER_MODE" = "preview" ]; then
            pnpm exec vite preview --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/dsai-vite-preview.log" 2>&1 &
            echo "$!" > "$RUNNER_TEMP/dsai-vite-preview.pid"
          fi
          for attempt in $(seq 1 120); do
            if curl --silent --show-error --fail "$DSAI_BROWSER_URL" -o /dev/null; then
              echo "Browser target is responding: $DSAI_BROWSER_URL"
              break
            fi
            if [ "$attempt" -eq 120 ]; then
              echo "Browser target did not become reachable within 4 minutes." >&2
              if [ -f "$RUNNER_TEMP/dsai-vite-preview.log" ]; then cat "$RUNNER_TEMP/dsai-vite-preview.log"; fi
              exit 1
            fi
            sleep 2
          done
          "$RUNNER_TEMP/dsai-browser-smoke/node_modules/.bin/playwright" install --with-deps chromium
          node scripts/production-browser-smoke.mjs | tee artifacts/production-browser-smoke.txt
      - name: Scanner gateway security integration tests
        if: ${{ !cancelled() }}
        run: node --test scanner/scan-server.test.mjs
      - name: Validate ClamAV scanner gateway and Compose configuration
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check scanner/scan-server.mjs
          MALWARE_SCANNER_API_KEY=ci-test-key SCANNER_DOMAIN=scanner.example.test docker compose -f docker-compose.clamav.yml config --quiet
      - name: Real ClamAV container integration (clean, EICAR, auth and outage)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          MALWARE_SCANNER_API_KEY: dsai-ci-clamav-integration-key
          SCANNER_DOMAIN: localhost
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          cleanup() {
            timeout 30s env MALWARE_SCANNER_API_KEY="$MALWARE_SCANNER_API_KEY" SCANNER_DOMAIN="$SCANNER_DOMAIN" docker compose -f docker-compose.clamav.yml down --timeout 10 --volumes --remove-orphans || true
          }
          trap cleanup EXIT
          docker compose -f docker-compose.clamav.yml up --detach clamav scanner
          ready=0
          for attempt in $(seq 1 180); do
            if curl --silent --show-error --fail http://127.0.0.1:8080/healthz > /tmp/dsai-clamav-health.json 2>/dev/null; then
              ready=1
              break
            fi
            sleep 5
          done
          if [ "$ready" -ne 1 ]; then
            echo "REAL_CLAMAV_HEALTH=FAIL"
            docker compose -f docker-compose.clamav.yml logs clamav scanner || true
            exit 1
          fi
          grep --quiet '"engine":"clamav"' /tmp/dsai-clamav-health.json
          printf '%s\n' 'REAL_CLAMAV_HEALTH=PASS' >> artifacts/clamav-live-integration.txt

          auth_status="$(curl --silent --show-error --output /tmp/dsai-clamav-auth.json --write-out '%{http_code}' --request POST --header 'Content-Type: application/octet-stream' --data-binary 'unauthorized' http://127.0.0.1:8080/scan)"
          test "$auth_status" = "401"
          printf '%s\n' 'REAL_CLAMAV_INVALID_AUTH=PASS' >> artifacts/clamav-live-integration.txt

          printf '%s' 'DSAI ClamAV benign-file integration test' > /tmp/dsai-clamav-clean.bin
          clean_status="$(curl --silent --show-error --output /tmp/dsai-clamav-clean.json --write-out '%{http_code}' --request POST --header "Authorization: Bearer $MALWARE_SCANNER_API_KEY" --header 'Content-Type: application/octet-stream' --data-binary @/tmp/dsai-clamav-clean.bin http://127.0.0.1:8080/scan)"
          test "$clean_status" = "200"
          grep --quiet '"clean":true' /tmp/dsai-clamav-clean.json
          grep --quiet '"engine":"clamav"' /tmp/dsai-clamav-clean.json
          printf '%s\n' 'REAL_CLAMAV_BENIGN_FILE=PASS' >> artifacts/clamav-live-integration.txt

          printf '%s' 'X5O!P%@AP[4\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*' > /tmp/dsai-clamav-eicar.txt
          eicar_status="$(curl --silent --show-error --output /tmp/dsai-clamav-eicar.json --write-out '%{http_code}' --request POST --header "Authorization: Bearer $MALWARE_SCANNER_API_KEY" --header 'Content-Type: application/octet-stream' --data-binary @/tmp/dsai-clamav-eicar.txt http://127.0.0.1:8080/scan)"
          test "$eicar_status" = "422"
          grep --quiet '"clean":false' /tmp/dsai-clamav-eicar.json
          printf '%s\n' 'REAL_CLAMAV_EICAR_REJECTION=PASS' >> artifacts/clamav-live-integration.txt

          docker compose -f docker-compose.clamav.yml stop clamav
          outage_status="$(curl --silent --show-error --output /tmp/dsai-clamav-outage.json --write-out '%{http_code}' --request POST --header "Authorization: Bearer $MALWARE_SCANNER_API_KEY" --header 'Content-Type: application/octet-stream' --data-binary @/tmp/dsai-clamav-clean.bin http://127.0.0.1:8080/scan)"
          test "$outage_status" = "503"
          printf '%s\n' 'REAL_CLAMAV_OUTAGE_FAIL_CLOSED=PASS' >> artifacts/clamav-live-integration.txt
          cat artifacts/clamav-live-integration.txt

      - name: Docker Compose liveness and database-readiness smoke tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cp .env.production.example .env
          cleanup() {
            timeout 30s docker compose down --timeout 10 --volumes --remove-orphans || {
              timeout 10s docker compose kill || true
            }
            rm -f .env
          }
          trap cleanup EXIT
          timeout 300s docker compose up --detach --build
          for attempt in $(seq 1 60); do
            ready_response="$(curl --silent --show-error --max-time 3 http://127.0.0.1:3000/readyz || true)"
            if printf '%s' "$ready_response" | grep --quiet '"status":"ready"'; then
              health_response="$(curl --silent --show-error --fail --max-time 5 http://127.0.0.1:3000/healthz)"
              if ! printf '%s' "$health_response" | grep --quiet '"status":"ok"'; then
                echo "DOCKER_COMPOSE_LIVENESS=FAIL"
                printf '%s\n' "$health_response"
                docker compose logs app postgres || true
                exit 1
              fi
              echo "DOCKER_COMPOSE_LIVENESS=PASS"
              echo "DOCKER_COMPOSE_DATABASE_READINESS=PASS"
              exit 0
            fi
            if ! docker compose ps --status running --services | grep --quiet --fixed-strings --line-regexp -- app; then
              echo "APP_CONTAINER_EXITED_BEFORE_READY=FAIL"
              docker compose logs app postgres || true
              exit 1
            fi
            sleep 2
          done
          echo "DOCKER_COMPOSE_DATABASE_READINESS=FAIL"
          docker compose logs app postgres || true
          exit 1
      - name: Write immutable run metadata
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "commit=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "workflow=$GITHUB_WORKFLOW"
            echo "ref=$GITHUB_REF"
            echo "runner_os=$RUNNER_OS"
            echo "node=$(node --version)"
            echo "pnpm=$(pnpm --version)"
            echo "generated_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > artifacts/release-evidence.txt
      - name: Enforce supply-chain gates
        if: always()
        shell: bash
        env:
          DEPENDENCY_AUDIT_OUTCOME: ${{ steps.dependency-audit.outcome }}
          LICENSE_INVENTORY_OUTCOME: ${{ steps.license-inventory.outcome }}
        run: |
          set -Eeuo pipefail
          test "$DEPENDENCY_AUDIT_OUTCOME" = "success" || { echo "DEPENDENCY_AUDIT_FAILED"; exit 1; }
          test "$LICENSE_INVENTORY_OUTCOME" = "success" || { echo "LICENSE_INVENTORY_FAILED"; exit 1; }
      - name: Upload test and release evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.2
        with:
          name: dsai-ci-evidence-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
