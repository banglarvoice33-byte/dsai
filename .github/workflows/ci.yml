name: CI

on:
  # Run the same release-quality checks before a change can be merged to main.
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dsai-ci-${{ github.workflow }}-${{ github.ref }}
  # Keep active verification runs intact for both PRs and main.
  cancel-in-progress: false

jobs:
  verify:
    name: TypeScript, accessibility, tests, production and Docker builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          package_json_file: package.json
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.2
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm run check
      - name: Accessibility checks
        run: pnpm run check:a11y
      - name: Unit tests with machine-readable JUnit report
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          pnpm exec vitest run --reporter=default --reporter=junit --outputFile=artifacts/junit.xml
          test -s artifacts/junit.xml
      - name: Production build
        run: pnpm run build
      - name: Docker Compose liveness and database-readiness smoke tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cp .env.production.example .env
          cleanup() {
            docker compose down --volumes --remove-orphans || true
            rm -f .env
          }
          trap cleanup EXIT
          docker compose up --detach --build
          for attempt in $(seq 1 60); do
            ready_response="$(curl --silent --show-error http://127.0.0.1:3000/readyz || true)"
            if printf '%s' "$ready_response" | grep --quiet '"status":"ready"'; then
              health_response="$(curl --silent --show-error --fail http://127.0.0.1:3000/healthz)"
              if ! printf '%s' "$health_response" | grep --quiet '"status":"ok"'; then
                echo "DOCKER_COMPOSE_LIVENESS=FAIL"
                printf '%s\n' "$health_response"
                docker compose logs app postgres || true
                exit 1
              fi
              echo "DOCKER_COMPOSE_LIVENESS=PASS"
              echo "DOCKER_COMPOSE_DATABASE_READINESS=PASS"
              exit 0
            fi
            if ! docker compose ps --status running --services | grep --quiet --fixed-strings --line-regexp -- app; then
              echo "APP_CONTAINER_EXITED_BEFORE_READY=FAIL"
              docker compose logs app postgres || true
              exit 1
            fi
            sleep 2
          done
          echo "DOCKER_COMPOSE_DATABASE_READINESS=FAIL"
          docker compose logs app postgres || true
          exit 1
      - name: Write immutable run metadata
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "commit=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "workflow=$GITHUB_WORKFLOW"
            echo "ref=$GITHUB_REF"
            echo "runner_os=$RUNNER_OS"
            echo "node=$(node --version)"
            echo "pnpm=$(pnpm --version)"
            echo "generated_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > artifacts/release-evidence.txt
      - name: Upload test and release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dsai-ci-evidence-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
