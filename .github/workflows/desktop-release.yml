name: DSAI Desktop Release

on:
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-release.yml"
      - ".github/workflows/ios-native.yml"
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

concurrency:
  group: dsai-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    name: Build ${{ matrix.os }} installers
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
          - os: macos-15
            platform: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install pinned desktop dependencies
        run: npm install --package-lock-only --ignore-scripts && npm ci
      - name: Import optional Windows code-signing certificate
        if: matrix.platform == 'windows'
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PFX_BASE64)) {
            Write-Host "No Windows signing certificate configured; producing an unsigned installer."
          } else {
            $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64)
            $path = Join-Path $env:RUNNER_TEMP "dsai-code-signing.pfx"
            [IO.File]::WriteAllBytes($path, $bytes)
            "CSC_LINK=$path" | Out-File -FilePath $env:GITHUB_ENV -Append
            "CSC_KEY_PASSWORD=$env:WINDOWS_CERTIFICATE_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
      - name: Build Windows installers
        if: matrix.platform == 'windows'
        run: npx electron-builder --win nsis msi
      - name: Import optional Apple Developer ID certificate
        if: matrix.platform == 'macos'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "$MACOS_CERTIFICATE_P12_BASE64" ]]; then
            echo "No Apple Developer ID certificate configured; producing an unsigned DMG."
          else
            CERT_PATH="$RUNNER_TEMP/dsai-developer-id.p12"
            printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"
            chmod 600 "$CERT_PATH"
            echo "CSC_LINK=$CERT_PATH" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$MACOS_CERTIFICATE_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
          fi
      - name: Build macOS disk image
        if: matrix.platform == 'macos'
        run: npx electron-builder --mac dmg
      - name: Generate checksums
        shell: bash
        run: |
          set -Eeuo pipefail
          cd dist
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            sha256sum *.exe *.msi > SHA256SUMS.txt
          else
            shasum -a 256 *.dmg > SHA256SUMS.txt
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DSAI-Desktop-${{ matrix.platform }}
          path: desktop/dist/*
          if-no-files-found: error
          retention-days: 14
