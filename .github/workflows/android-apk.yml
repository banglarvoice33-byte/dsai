name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "scripts/build-android-apk.sh"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dsai-android-apk-${{ github.workflow }}-${{ github.ref }}
  # Do not cancel an APK build already in progress when another main commit arrives.
  cancel-in-progress: false

jobs:
  build-debug-apk:
    name: Build and verify DSAI debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0
        with:
          gradle-version: "8.10.2"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      - name: Install pinned Android SDK packages
        shell: bash
        run: |
          set -Eeuo pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"

      - name: Build and verify production-origin APK
        shell: bash
        env:
          DSAI_ANDROID_ORIGIN: https://dsai-one.vercel.app
          DSAI_APK_VARIANT: debug
          DSAI_ANDROID_ARTIFACT: apk
          DSAI_APK_OUT_DIR: ${{ runner.temp }}/dsai-apk
        run: |
          set -Eeuo pipefail
          bash scripts/build-android-apk.sh
          test -s "${{ runner.temp }}/dsai-apk/DSAI-Android-1.0.1-debug.apk"
          test -s "${{ runner.temp }}/dsai-apk/DSAI-Android-1.0.1-debug.apk.sha256"
          test -s "${{ runner.temp }}/dsai-apk/DSAI-Android-1.0.1-debug.apk.metadata.txt"
          cat "${{ runner.temp }}/dsai-apk/DSAI-Android-1.0.1-debug.apk.metadata.txt"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DSAI-Android-1.0.1-debug
          path: |
            ${{ runner.temp }}/dsai-apk/DSAI-Android-1.0.1-debug.apk
            ${{ runner.temp }}/dsai-apk/DSAI-Android-1.0.1-debug.apk.sha256
            ${{ runner.temp }}/dsai-apk/DSAI-Android-1.0.1-debug.apk.metadata.txt
          if-no-files-found: error
          retention-days: 14
