name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "scripts/build-android-apk.sh"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - "scripts/build-android-apk.sh"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
    inputs:
      build_release:
        description: "Build upload-signed Android APK and Play Console AAB (requires repository signing secrets)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: dsai-android-apk-${{ github.workflow }}-${{ github.ref }}
  # Do not cancel an APK build already in progress when another main commit arrives.
  cancel-in-progress: false

jobs:
  build-debug-apk:
    name: Build and verify DSAI debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0
        with:
          gradle-version: "8.11.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      - name: Install pinned Android SDK packages
        shell: bash
        run: |
          set -Eeuo pipefail
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"

      - name: Build and verify production-origin APK
        shell: bash
        env:
          DSAI_ANDROID_ORIGIN: https://dsai-one.vercel.app
          DSAI_APK_VARIANT: debug
          DSAI_ANDROID_ARTIFACT: apk
          DSAI_APK_OUT_DIR: ${{ runner.temp }}/dsai-apk
        run: |
          set -Eeuo pipefail
          bash scripts/build-android-apk.sh
          test -s "${{ runner.temp }}/dsai-apk/DSAI-Android-1.0.2-debug.apk"
          test -s "${{ runner.temp }}/dsai-apk/DSAI-Android-1.0.2-debug.apk.sha256"
          test -s "${{ runner.temp }}/dsai-apk/DSAI-Android-1.0.2-debug.apk.metadata.txt"
          cat "${{ runner.temp }}/dsai-apk/DSAI-Android-1.0.2-debug.apk.metadata.txt"

      - name: Upload debug APK for device smoke testing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DSAI-Android-1.0.2-debug-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dsai-apk/DSAI-Android-1.0.2-debug.apk
            ${{ runner.temp }}/dsai-apk/DSAI-Android-1.0.2-debug.apk.sha256
            ${{ runner.temp }}/dsai-apk/DSAI-Android-1.0.2-debug.apk.metadata.txt
          if-no-files-found: error
          retention-days: 7

  check-signing:
    name: Check protected Android signing inputs
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_release == true) }}
    runs-on: ubuntu-24.04
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - name: Check signing secrets without exposing values
        id: check
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.DSAI_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.DSAI_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DSAI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DSAI_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          if [[ -n "$KEYSTORE_B64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Android signing inputs are configured."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Android release signing is not configured; signed release job will be skipped."
            echo "Configure DSAI_KEYSTORE_BASE64, DSAI_KEYSTORE_PASSWORD, DSAI_KEY_ALIAS and DSAI_KEY_PASSWORD as repository secrets to enable it." >> "$GITHUB_STEP_SUMMARY"
          fi

  build-release-aab:
    name: Build and verify upload-signed Android APK and App Bundle
    needs: [build-debug-apk, check-signing]
    if: ${{ (github.event_name == 'push' || inputs.build_release == true) && needs.check-signing.outputs.available == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0
        with:
          gradle-version: "8.11.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      - name: Install pinned Android SDK packages
        shell: bash
        run: |
          set -Eeuo pipefail
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0"
          test -d "$ANDROID_HOME/platforms/android-36"

      - name: Decode private upload keystore and build signed AAB
        shell: bash
        env:
          DSAI_KEYSTORE_BASE64: ${{ secrets.DSAI_KEYSTORE_BASE64 }}
          DSAI_KEYSTORE_PASSWORD: ${{ secrets.DSAI_KEYSTORE_PASSWORD }}
          DSAI_KEY_ALIAS: ${{ secrets.DSAI_KEY_ALIAS }}
          DSAI_KEY_PASSWORD: ${{ secrets.DSAI_KEY_PASSWORD }}
          DSAI_ANDROID_ORIGIN: https://dsai-one.vercel.app
          DSAI_APK_VARIANT: release
          DSAI_ANDROID_ARTIFACT: aab
          DSAI_APK_NAME: DSAI-Android-1.0.2-release.aab
          DSAI_APK_OUT_DIR: ${{ runner.temp }}/dsai-release
        run: |
          set -Eeuo pipefail
          for name in DSAI_KEYSTORE_BASE64 DSAI_KEYSTORE_PASSWORD DSAI_KEY_ALIAS DSAI_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required repository secret: $name"
              exit 1
            fi
          done
          export DSAI_KEYSTORE_PATH="$RUNNER_TEMP/dsai-upload-keystore.jks"
          printf '%s' "$DSAI_KEYSTORE_BASE64" | base64 --decode > "$DSAI_KEYSTORE_PATH"
          chmod 600 "$DSAI_KEYSTORE_PATH"
          keytool -list -keystore "$DSAI_KEYSTORE_PATH" -storepass "$DSAI_KEYSTORE_PASSWORD" -alias "$DSAI_KEY_ALIAS" >/dev/null
          # Build and verify the Play Console AAB.
          bash scripts/build-android-apk.sh
          jarsigner -verify -verbose -certs "$DSAI_APK_OUT_DIR/DSAI-Android-1.0.2-release.aab"

          # Build a separately installable, upload-key-signed APK from the same source.
          export DSAI_ANDROID_ARTIFACT=apk
          export DSAI_APK_NAME=DSAI-Android-1.0.2-release.apk
          bash scripts/build-android-apk.sh
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$DSAI_APK_OUT_DIR/DSAI-Android-1.0.2-release.apk"
          rm -f "$DSAI_KEYSTORE_PATH"

      - name: Upload signed Android APK and Play Console AAB
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DSAI-Android-1.0.2-release
          path: |
            ${{ runner.temp }}/dsai-release/DSAI-Android-1.0.2-release.aab
            ${{ runner.temp }}/dsai-release/DSAI-Android-1.0.2-release.aab.sha256
            ${{ runner.temp }}/dsai-release/DSAI-Android-1.0.2-release.aab.metadata.txt
            ${{ runner.temp }}/dsai-release/DSAI-Android-1.0.2-release.apk
            ${{ runner.temp }}/dsai-release/DSAI-Android-1.0.2-release.apk.sha256
            ${{ runner.temp }}/dsai-release/DSAI-Android-1.0.2-release.apk.metadata.txt
          if-no-files-found: error
          retention-days: 14
