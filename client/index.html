          {"@type":"Question","name":"DSAI কী এবং কীভাবে কাজে লাগে?","acceptedAnswer":{"@type":"Answer","text":"DSAI একটি বাংলা-first AI Workdesk। জটিল তথ্য বুঝতে, checklist ও draft তৈরি করতে এবং পরবর্তী কাজ গুছিয়ে নিতে ব্যবহার করুন। গুরুত্বপূর্ণ সিদ্ধান্তের আগে তথ্য নিজে যাচাই করুন।"}},

          {"@type":"Question","name":"Creative Studio-তে ছবি তৈরি করা যাবে?","acceptedAnswer":{"@type":"Answer","text":"Creative Studio-তে বাংলা, Banglish বা English prompt দিয়ে ছবি তৈরির অনুরোধ করা যায়। সফলভাবে তৈরি ছবির সীমা প্রতি account-এ দিনে ২টি এবং মোট ৫০০টি স্বতন্ত্র account। Provider বা account configuration সমস্যায় সেবা সাময়িকভাবে অনুপলভ্য হতে পারে।"}},
