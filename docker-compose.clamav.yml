services:
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamav-db:/var/lib/clamav
    expose:
      - "3310"
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 3"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
  scanner:
    build: ./scanner
    restart: unless-stopped
    environment:
      PORT: "8080"
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
      MALWARE_SCANNER_API_KEY: ${MALWARE_SCANNER_API_KEY:?Set a long random scanner API key}
    depends_on:
      clamav:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  clamav-db:
